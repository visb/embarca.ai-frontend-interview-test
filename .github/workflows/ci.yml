name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatação, lint e tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run format:check

      - run: pnpm run lint

      - run: pnpm run typecheck

  test:
    name: Testes unitários e de componente
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  build:
    name: Build de produção
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # O build prerenderiza as 100 rotas de detalhe, então bate na PokeAPI de
      # verdade. É o passo que pega tanto erro de tipo quanto diretiva de cache
      # mal aplicada.
      - run: pnpm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com

  e2e:
    name: Testes e2e (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # Os dois projetos: `chromium` (caminho feliz) e `chromium-erros` (catálogo
      # e detalhe fora do ar). O Playwright sobe o mock de fixtures antes do
      # build, então este job não depende da PokeAPI real.
      - run: pnpm run test:e2e

      # Sem o relatório, uma falha na CI vira só o nome do teste. Com ele, o
      # trace abre o passo a passo do que o browser fez.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
